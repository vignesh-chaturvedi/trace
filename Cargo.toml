[workspace]
resolver = "2"
members = ["crates/trace-core", "crates/trace-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
blake3 = "1"
libc = "0.2"
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ureq = { version = "2", features = ["json", "tls"], default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
